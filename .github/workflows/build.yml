name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            engine/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../android/app/src/main/assets/www
          cp -r dist/* ../android/app/src/main/assets/www/

      - name: Bundle engine
        run: |
          cd engine
          npm ci
          npm run build
          cd ..
          zip -qr altair-engine.zip engine/dist engine/package.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0" > /dev/null

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altair-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: altair-engine
          path: altair-engine.zip
