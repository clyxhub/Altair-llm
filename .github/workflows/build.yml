name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            engine/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build
          mkdir -p ../android/app/src/main/assets/www
          cp -r dist/* ../android/app/src/main/assets/www/

      - name: Bundle engine
        run: |
          cd engine
          npm ci
          npm run build
          cd ..
          zip -qr altair-engine.zip engine/dist engine/package.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0" > /dev/null

      - name: Build llama.cpp (llama-server + Vulkan) for Android
        run: |
          git clone --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cd /tmp/llama.cpp
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/27.2.12479018)
          export PATH="$PATH:$NDK_DIR/shader-tools/$(ls "$NDK_DIR/shader-tools" | head -1)"
          # Cross-compile has no host Vulkan SDK: provide an arm64 stub libvulkan.so.
          # Headers resolve from the NDK sysroot; at runtime Android's real system
          # libvulkan.so is used (it's a public platform library).
          VSTUB=/tmp/vulkan-stub/lib
          mkdir -p "$VSTUB"
          echo 'void __altair_vulkan_stub(void){}' > /tmp/vulkan-stub/noop.c
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --target=aarch64-linux-android24 -shared \
            -o "$VSTUB/libvulkan.so" /tmp/vulkan-stub/noop.c
          export VULKAN_SDK=/tmp/vulkan-stub
          # ggml-vulkan requires the Khronos SPIRV-Headers config package (header-only)
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers /tmp/SPIRV-Headers
          cmake -S /tmp/SPIRV-Headers -B /tmp/spirv-build -DCMAKE_INSTALL_PREFIX=/tmp/spirv-install > /dev/null
          cmake --install /tmp/spirv-build > /dev/null
          # NDK ships vulkan.h but not the C++ bindings (vulkan.hpp) that ggml-vulkan uses.
          # Copy them into the NDK sysroot so every compile sees them.
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/Vulkan-Headers
          cmake -S /tmp/Vulkan-Headers -B /tmp/vh-build -DCMAKE_INSTALL_PREFIX=/tmp/vh-install > /dev/null
          cmake --install /tmp/vh-build > /dev/null
          cp -r /tmp/vh-install/include/vulkan "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/"
          cp -r /tmp/vh-install/include/vk_video "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/"
          cp -r /tmp/spirv-install/include/spirv "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/"
          ls "$NDK_DIR/sysroot/usr/include/vulkan" | head -5
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_PREFIX_PATH=/tmp/spirv-install \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
          cmake --build build-android --target llama-server -j"$(nproc)"
          OUT="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          cp build-android/bin/llama-server "$OUT/libaltairserver.so"
          for lib in libllama.so libggml.so libggml-base.so libggml-cpu.so libggml-vulkan.so; do
            find build-android -name "$lib" -exec cp {} "$OUT" \;
          done
          ls -la "$OUT"

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altair-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: altair-engine
          path: altair-engine.zip
