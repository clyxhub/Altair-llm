name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (NDK 26.1, CMake 3.22.1, platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install host glslc (Vulkan shader compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          echo "${ANDROID_HOME}/ndk/26.1.10909125/shader-tools/linux-x86_64" >> "$GITHUB_PATH"

      - name: Fetch llama.cpp (pinned for reproducible native build)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp android/third_party/llama.cpp
          git -C android/third_party/llama.cpp checkout 08ffba21e5c2f1728b6b405c05ff3913f65706d4
          echo "llama.cpp: $(git -C android/third_party/llama.cpp rev-parse --short HEAD)"
          ls android/third_party/llama.cpp | head

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('android/app/src/main/cpp/**', 'android/third_party/llama.cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cxx-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon assembleRelease > gradle-build.log 2>&1
          RC=$?
          echo "gradlew exit code: $RC"
          tail -n 150 gradle-build.log || true
          exit $RC

      - name: Publish build log on failure (diagnostics branch)
        if: failure()
        continue-on-error: true
        run: |
          git config user.email "ci@altair.local"
          git config user.name "Altair CI"
          mkdir -p ci-logs
          cp android/gradle-build.log ci-logs/last-build.log 2>/dev/null || echo "(no log)" > ci-logs/last-build.log
          git checkout -B ci-diagnostics
          git add -f ci-logs/last-build.log
          git commit -m "CI diagnostics for run ${{ github.run_number }}" || true
          git push -f origin ci-diagnostics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Altair-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
